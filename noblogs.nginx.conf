#
# Noblogs — configurazione nginx di esempio.
#
# Da adattare e includere in /etc/nginx/sites-available/ (Debian/Ubuntu) o
# /etc/nginx/conf.d/ (RHEL/Alma/Rocky). Le due cose da cambiare sono il
# dominio e il percorso della document root, che deve puntare a public/ e
# non alla radice del progetto.
#
# nginx non legge i file .htaccess: le protezioni che su Apache stanno in
# quei file sono riscritte qui sotto. Se le si toglie, config/config.php e
# la cartella dei caricamenti restano scoperti.
#

# ---------------------------------------------------------------------------
# Pool PHP-FPM. Il socket cambia con la versione di PHP installata:
# controllalo con «ls /run/php/».
# ---------------------------------------------------------------------------
upstream noblogs_php {
    server unix:/run/php/php8.3-fpm.sock;
    # In alternativa, PHP-FPM in ascolto su TCP:
    # server 127.0.0.1:9000;
}

# ---------------------------------------------------------------------------
# Zona per limitare le richieste. Serve soprattutto alle pagine di
# registrazione e accesso: l'applicazione ha già un limitatore proprio, ma
# fermare il traffico prima di PHP costa molto meno.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=noblogs_auth:10m rate=20r/m;

# ---------------------------------------------------------------------------
# Redirezione da HTTP a HTTPS, dominio principale e tutti i sottodomini.
#
# Il blocco resta necessario anche dopo aver installato il certificato:
# i vecchi collegamenti e i lettori di feed continuano ad arrivare in chiaro.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name esempio.tld *.esempio.tld;

    # Certbot ha bisogno di raggiungere questa cartella in chiaro.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Vhost principale: un solo blocco server per il dominio e per tutti i
# sottodomini.
#
# È la parte che rende possibile la modalità «sottodominio»: nginx accetta
# qualunque nome che finisca in .esempio.tld e passa l'host a PHP, che dal
# nome ricava di quale blog si tratta. Non serve un blocco server per blog.
#
# Perché funzioni servono due cose fuori da nginx:
#   1) un record DNS wildcard  *.esempio.tld  che punti a questo server;
#   2) un certificato wildcard per *.esempio.tld (con Let's Encrypt richiede
#      la validazione DNS-01, non basta quella via HTTP).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name esempio.tld *.esempio.tld;

    # La document root è public/, non la radice del progetto: tutto il resto
    # (config/, app/, storage/, db/) deve restare fuori dalla portata di nginx.
    root /var/www/noblogs/public;
    index index.php;

    charset utf-8;

    # -----------------------------------------------------------------------
    # Certificati. Devono essere wildcard, altrimenti i blog sui
    # sottodomini danno un errore di certificato non valido.
    # -----------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/esempio.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esempio.tld/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # -----------------------------------------------------------------------
    # Dimensione dei caricamenti. Deve stare sopra a upload_max_filesize di
    # PHP, altrimenti nginx rifiuta la richiesta prima che PHP possa dare un
    # messaggio d'errore comprensibile.
    # -----------------------------------------------------------------------
    client_max_body_size 24m;
    client_body_timeout  60s;

    # -----------------------------------------------------------------------
    # Intestazioni di sicurezza.
    #
    # X-Frame-Options riguarda solo il tentativo di incorniciare le nostre
    # pagine: gli iframe che gli autori inseriscono negli articoli (video,
    # mappe) sono richieste in uscita e non ne sono toccati.
    # -----------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Attiva HSTS solo quando il certificato wildcard è a posto e funziona:
    # con un sottodominio non coperto renderebbe i blog irraggiungibili.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------------------------------------------------
    # Compressione. Le immagini sono già compresse e si lasciano stare.
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml application/atom+xml image/svg+xml;

    # -----------------------------------------------------------------------
    # Registri. Le statistiche di Noblogs non usano i log di nginx: se non
    # servono per la diagnostica, si può spegnere access_log e non conservare
    # nessun indirizzo IP.
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/noblogs.access.log;
    error_log  /var/log/nginx/noblogs.error.log warn;
    # access_log off;

    # -----------------------------------------------------------------------
    # File caricati dagli utenti.
    #
    # Il blocco viene prima di quello dei .php perché deve vincere: qui
    # dentro nulla va passato a PHP-FPM, qualunque estensione abbia il file.
    # È la difesa principale contro un caricamento malevolo.
    # -----------------------------------------------------------------------
    location ^~ /media/ {
        # Niente elenco del contenuto della cartella.
        autoindex off;

        # Gli SVG possono contenere JavaScript: serviti con questa
        # Content-Security-Policy non possono fare nulla nemmeno se
        # aperti direttamente come pagina.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;

        # Il nome dei file contiene un identificativo e non cambia mai.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Qualunque nome che assomigli a uno script viene rifiutato invece
        # di essere servito o eseguito.
        location ~* \.(php[0-9]?|phtml|pht|phar|phps|cgi|pl|py|rb|sh|lua|shtml|jsp|aspx?)($|\.) {
            deny all;
        }

        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Asset della piattaforma e dei temi.
    # -----------------------------------------------------------------------
    location ^~ /assets/ {
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Niente accesso ai file nascosti (.git, .env, .htaccess) né ai file di
    # servizio che potrebbero finire nella document root durante un
    # aggiornamento fatto a mano.
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sql|sqlite|db|log|ini|bak|old|orig|save|swp|dist|sample|md|yml|yaml|lock)$ {
        deny all;
    }

    # -----------------------------------------------------------------------
    # Limite di richieste sulle pagine di accesso e registrazione.
    # -----------------------------------------------------------------------
    location ~ ^/(accedi|registrati|password)(/|$) {
        limit_req zone=noblogs_auth burst=10 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    # -----------------------------------------------------------------------
    # Tutto il resto passa al front controller.
    #
    # L'installer (/install/) non è una cartella dentro public/: è
    # public/index.php che lo include finché config/config.php non esiste.
    # Non serve quindi nessuna regola dedicata.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # -----------------------------------------------------------------------
    # PHP. L'unico file che si può eseguire è index.php: con questa forma
    # esatta non esiste modo di far interpretare un altro file dalla
    # document root, nemmeno con un percorso costruito ad arte.
    # -----------------------------------------------------------------------
    location = /index.php {
        include fastcgi_params;

        fastcgi_pass noblogs_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # Senza questo PHP non vede l'host richiesto e non riesce a capire di
        # quale blog si tratta.
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS     on;

        # La generazione di un feed o di una pagina di archivio molto grande
        # può superare i 30 secondi di default.
        fastcgi_read_timeout 60s;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;

        # PHP non deve poter aprire file fuori dal progetto.
        fastcgi_param PHP_VALUE "open_basedir=/var/www/noblogs:/tmp:/usr/share/zoneinfo";
    }

    # Qualunque altro .php viene rifiutato: non ce ne sono da eseguire.
    location ~ \.php$ {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Domini personalizzati dei blog (routing.custom_domains = true).
#
# Se si permette agli autori di puntare un dominio proprio al blog, serve un
# blocco che risponda a qualunque nome non elencato sopra. Il certificato non
# può essere wildcard: va emesso per ciascun dominio, per esempio con
# certbot --nginx dopo che il DNS punta qui.
#
# Va tenuto per ultimo: nginx usa il default_server solo quando nessun
# server_name corrisponde.
# ---------------------------------------------------------------------------
# server {
#     listen 443 ssl default_server;
#     listen [::]:443 ssl default_server;
#     http2 on;
#
#     server_name _;
#
#     ssl_certificate     /etc/letsencrypt/live/esempio.tld/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/esempio.tld/privkey.pem;
#
#     root /var/www/noblogs/public;
#     include /etc/nginx/snippets/noblogs-common.conf;
# }
